services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon_dev_only
      POSTGRES_DB: salon
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
