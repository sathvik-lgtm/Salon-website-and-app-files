name: CI
on:
  pull_request:
  push:
    branches: [main]

# The website copies its content from the database before it is built or type-checked, and the booking
# engine's concurrency tests need a real Postgres, so both jobs run against a disposable Postgres 17 service
# (same major version as docker-compose.yml) that is migrated and seeded with placeholder data.
# SEED_OWNER_* are throwaway values for that disposable database, not real credentials.
# The Turnstile keys are Cloudflare's published DUMMY test keys (they always pass), so they are not secrets.
# The `check` job also runs the browser tests (Playwright): they book through the real website.

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon_dev_only
          POSTGRES_DB: salon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d salon"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://salon:salon_dev_only@localhost:5432/salon
      DB_DRIVER: pg
      SEED_OWNER_EMAIL: ci-owner@example.invalid
      SEED_OWNER_PASSWORD: ci-only-throwaway-password
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrate and seed first: the website's typecheck and build copy its content out of the database.
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install the browser for the end-to-end tests
        run: pnpm --filter @salon/web exec playwright install --with-deps chromium
      - name: End-to-end tests (real browser, real booking flow)
        run: pnpm --filter @salon/web e2e
      - name: Keep the browser-test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Verifies each app fits the Workers Free plan (3 MiB gzipped) using a real OpenNext build.
  cloudflare-size:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, staff]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon_dev_only
          POSTGRES_DB: salon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d salon"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://salon:salon_dev_only@localhost:5432/salon
      SEED_OWNER_EMAIL: ci-owner@example.invalid
      SEED_OWNER_PASSWORD: ci-only-throwaway-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: OpenNext build
        run: pnpm --filter @salon/${{ matrix.app }} cf:build
      - name: Wrangler dry-run (reports gzip size)
        working-directory: apps/${{ matrix.app }}
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry
